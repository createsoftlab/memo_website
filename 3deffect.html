<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Photo Carousel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
            overflow-x: hidden;
        }

        .scene {
            perspective: 1400px;
            transform-style: preserve-3d;
        }

        .carousel-container {
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .carousel-card {
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s ease, box-shadow 0.6s ease;
            backface-visibility: hidden;
        }

        /* Custom glow & glassmorphism effects */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 
                        0 0 30px rgba(99, 102, 241, 0.15);
        }

        /* Custom scrollbar for modals if needed */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <header class="w-full py-6 px-8 flex justify-between items-center glass-panel border-b border-white/10 sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-cube text-white text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">Nexus3D</h1>
                <p class="text-xs text-slate-400">Immersive Visual Showcase</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <button id="autoPlayBtn" class="px-4 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 text-xs font-semibold flex items-center space-x-2 transition-all duration-300 shadow-md">
                <i class="fa-solid fa-play text-indigo-400" id="playIcon"></i>
                <span id="playText">Auto Play</span>
            </button>
            <button onclick="openAddModal()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-xs font-semibold flex items-center space-x-2 transition-all duration-300 shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-plus"></i>
                <span>Add Card</span>
            </button>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center relative px-4 py-12">
        <!-- Background ambient lighting blobs -->
        <div class="absolute w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl -top-20 left-1/4 pointer-events-none"></div>
        <div class="absolute w-96 h-96 bg-purple-600/15 rounded-full blur-3xl -bottom-20 right-1/4 pointer-events-none"></div>

        <!-- 3D Scene Wrapper -->
        <div class="scene w-full max-w-6xl h-[480px] md:h-[540px] flex items-center justify-center relative">
            <div id="carousel" class="carousel-container relative w-full h-full flex items-center justify-center">
                <!-- Cards will be dynamically injected here via JavaScript -->
            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="flex items-center justify-center space-x-6 mt-10 z-20">
            <button id="prevBtn" class="w-14 h-14 rounded-2xl glass-panel hover:bg-slate-800 flex items-center justify-center text-slate-200 hover:text-white transition-all duration-300 shadow-xl group border border-white/10 active:scale-95">
                <i class="fa-solid fa-arrow-left text-lg group-hover:-translate-x-1 transition-transform"></i>
            </button>
            
            <div id="indicators" class="flex items-center space-x-3 px-6 py-3 rounded-2xl glass-panel border border-white/10 shadow-xl">
                <!-- Indicators injected dynamically -->
            </div>

            <button id="nextBtn" class="w-14 h-14 rounded-2xl glass-panel hover:bg-slate-800 flex items-center justify-center text-slate-200 hover:text-white transition-all duration-300 shadow-xl group border border-white/10 active:scale-95">
                <i class="fa-solid fa-arrow-right text-lg group-hover:translate-x-1 transition-transform"></i>
            </button>
        </div>
    </main>

    <!-- Detailed View Modal -->
    <div id="detailModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300">
        <div id="modalContent" class="glass-panel w-full max-w-2xl rounded-3xl overflow-hidden shadow-2xl border border-white/15 transform scale-95 transition-all duration-300">
            <div class="relative h-72 w-full overflow-hidden">
                <img id="modalImg" src="" alt="Card detail image" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent"></div>
                <button onclick="closeDetailModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-slate-900/60 backdrop-blur-md flex items-center justify-center text-white hover:bg-slate-900 transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <span id="modalBadge" class="absolute bottom-4 left-6 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-indigo-500/80 backdrop-blur-md text-white shadow-lg"></span>
            </div>
            <div class="p-8">
                <p id="modalSubtitle" class="text-indigo-400 font-semibold text-sm uppercase tracking-wider mb-2"></p>
                <h2 id="modalTitle" class="text-2xl md:text-3xl font-extrabold text-white mb-4"></h2>
                <p id="modalDesc" class="text-slate-300 text-sm md:text-base leading-relaxed mb-6"></p>
                <div class="flex justify-end space-x-4">
                    <button onclick="closeDetailModal()" class="px-6 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-semibold transition-colors">Close</button>
                    <button class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold transition-colors shadow-lg shadow-indigo-600/30">Explore More</button>
                </div>
            </div>
        </div>
    </div>



    <script>
        // Initial dataset for carousel cards
        let cardsData = [
            {
                title: "Neon Cyberpunk City",
                subtitle: "Futuristic Metropolis",
                badge: "Trending",
                image: "https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1000&auto=format&fit=crop",
                description: "Explore the bustling neon-drenched streets of a futuristic megalopolis where technology and humanity intertwine under perpetual rain."
            },
            {
                title: "Serene Alpine Peaks",
                subtitle: "Mountain Wilderness",
                badge: "Nature",
                image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1000&auto=format&fit=crop",
                description: "Majestic snow-capped mountain peaks reflecting crisp morning sunlight over crystal clear glacial alpine lakes."
            },
            {
                title: "Deep Cosmos Nebula",
                subtitle: "Interstellar Odyssey",
                badge: "Astronomy",
                image: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1000&auto=format&fit=crop",
                description: "Vibrant clouds of interstellar gas and cosmic dust forming newborn stellar systems billions of light years away."
            },
            {
                title: "Zen Minimalist Architecture",
                subtitle: "Modern Design",
                badge: "Design",
                image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1000&auto=format&fit=crop",
                description: "Clean lines, natural light, and tranquil structural harmony designed for mindful living and quiet contemplation."
            },
            {
                title: "Mystic Autumn Forest",
                subtitle: "Golden Woodlands",
                badge: "Seasonal",
                image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000&auto=format&fit=crop",
                description: "A tranquil winding path through ancient woodlands covered in a vibrant carpet of crisp orange and golden amber autumn leaves."
            }
        ];

        let currentIndex = 0;
        let isAutoPlaying = false;
        let autoPlayTimer = null;
        let isDragging = false;
        let startX = 0;
        let dragThreshold = 50;

        const carousel = document.getElementById('carousel');
        const indicatorsContainer = document.getElementById('indicators');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const autoPlayBtn = document.getElementById('autoPlayBtn');
        const playIcon = document.getElementById('playIcon');
        const playText = document.getElementById('playText');

        // Initialize Carousel
        function initCarousel() {
            renderCards();
            renderIndicators();
            updateCarousel();
        }

        // Render Cards into DOM
        function renderCards() {
            carousel.innerHTML = '';
            const totalCards = cardsData.length;
            const angleStep = 360 / totalCards;

            cardsData.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = `carousel-card absolute w-72 sm:w-80 h-[400px] sm:h-[440px] rounded-3xl overflow-hidden glass-panel card-shadow cursor-pointer select-none`;
                
                // Calculate 3D position
                const angle = index * angleStep;
                const radius = window.innerWidth < 768 ? 220 : 340;
                
                cardEl.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
                
                cardEl.innerHTML = `
                    <div class="relative w-full h-full flex flex-col justify-between group">
                        <div class="absolute inset-0 overflow-hidden">
                            <img src="${card.image}" alt="${card.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" onerror="this.src='https://placehold.co/600x400/1e293b/818cf8?text=Image+Unavailable'">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                        </div>
                        <div class="relative z-10 p-5 flex justify-between items-start">
                            <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-indigo-500/80 backdrop-blur-md text-white shadow-lg">${card.badge}</span>
                            <div class="w-9 h-9 rounded-full bg-slate-900/60 backdrop-blur-md flex items-center justify-center text-white group-hover:bg-indigo-600 transition-colors">
                                <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                            </div>
                        </div>
                        <div class="relative z-10 p-6 flex flex-col justify-end bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent">
                            <span class="text-indigo-400 font-semibold text-xs uppercase tracking-wider mb-1">${card.subtitle}</span>
                            <h3 class="text-xl font-extrabold text-white mb-2 leading-tight">${card.title}</h3>
                            <p class="text-slate-300 text-xs line-clamp-2">${card.description}</p>
                        </div>
                    </div>
                `;

                // Click event to focus or open detail
                cardEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (currentIndex === index) {
                        openDetailModal(card);
                    } else {
                        currentIndex = index;
                        updateCarousel();
                    }
                });

                carousel.appendChild(cardEl);
            });
        }

        // Render Navigation Dots
        function renderIndicators() {
            indicatorsContainer.innerHTML = '';
            cardsData.forEach((_, index) => {
                const dot = document.createElement('button');
                dot.className = `h-2.5 rounded-full transition-all duration-300 ${index === currentIndex ? 'w-8 bg-indigo-500 shadow-lg shadow-indigo-500/50' : 'w-2.5 bg-slate-600 hover:bg-slate-500'}`;
                dot.addEventListener('click', () => {
                    currentIndex = index;
                    updateCarousel();
                });
                indicatorsContainer.appendChild(dot);
            });
        }

        // Update 3D Carousel Rotation & Opacity/Scale Depth
        function updateCarousel() {
            const totalCards = cardsData.length;
            const angleStep = 360 / totalCards;
            const targetRotation = -currentIndex * angleStep;
            
            carousel.style.transform = `rotateY(${targetRotation}deg)`;

            // Update cards active states for visual hierarchy (blur background cards)
            const cardElements = carousel.querySelectorAll('.carousel-card');
            cardElements.forEach((el, index) => {
                if (index === currentIndex) {
                    el.style.filter = 'brightness(1) blur(0px)';
                    el.style.zIndex = '30';
                    el.style.pointerEvents = 'auto';
                } else {
                    el.style.filter = 'brightness(0.6) blur(2px)';
                    el.style.zIndex = '10';
                    el.style.pointerEvents = 'auto';
                }
            });

            // Update indicators active states
            const dots = indicatorsContainer.querySelectorAll('button');
            dots.forEach((dot, index) => {
                if (index === currentIndex) {
                    dot.className = 'h-2.5 w-8 rounded-full bg-indigo-500 shadow-lg shadow-indigo-500/50 transition-all duration-300';
                } else {
                    dot.className = 'h-2.5 w-2.5 rounded-full bg-slate-600 hover:bg-slate-500 transition-all duration-300';
                }
            });
        }

        // Navigation Controls
        function nextSlide() {
            currentIndex = (currentIndex + 1) % cardsData.length;
            updateCarousel();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + cardsData.length) % cardsData.length;
            updateCarousel();
        }

        nextBtn.addEventListener('click', nextSlide);
        prevBtn.addEventListener('click', prevSlide);

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Touch and Swipe Support for Mobile
        carousel.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
        });

        carousel.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const currentX = e.touches[0].clientX;
            const diff = startX - currentX;

            if (Math.abs(diff) > dragThreshold) {
                if (diff > 0) {
                    nextSlide();
                } else {
                    prevSlide();
                }
                isDragging = false;
            }
        });

        carousel.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Auto Play Feature
        function toggleAutoPlay() {
            isAutoPlaying = !isAutoPlaying;
            if (isAutoPlaying) {
                playIcon.className = 'fa-solid fa-pause text-indigo-400';
                playText.textContent = 'Pause Play';
                autoPlayTimer = setInterval(nextSlide, 3500);
            } else {
                playIcon.className = 'fa-solid fa-play text-indigo-400';
                playText.textContent = 'Auto Play';
                clearInterval(autoPlayTimer);
            }
        }

        autoPlayBtn.addEventListener('click', toggleAutoPlay);

        // Modal Controls
        function openDetailModal(card) {
            document.getElementById('modalImg').src = card.image;
            document.getElementById('modalBadge').textContent = card.badge;
            document.getElementById('modalSubtitle').textContent = card.subtitle;
            document.getElementById('modalTitle').textContent = card.title;
            document.getElementById('modalDesc').textContent = card.description;

            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function closeDetailModal() {
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
        }

        function openAddModal() {
            const modal = document.getElementById('addModal');
            const content = document.getElementById('addModalContent');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function closeAddModal() {
            const modal = document.getElementById('addModal');
            const content = document.getElementById('addModalContent');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            document.getElementById('cardForm').reset();
        }

        function handleAddNewCard(e) {
            e.preventDefault();
            const newCard = {
                title: document.getElementById('inputTitle').value,
                subtitle: document.getElementById('inputSubtitle').value,
                badge: document.getElementById('inputBadge').value,
                image: document.getElementById('inputImg').value,
                description: document.getElementById('inputDesc').value
            };

            cardsData.push(newCard);
            currentIndex = cardsData.length - 1;
            renderCards();
            renderIndicators();
            updateCarousel();
            closeAddModal();
        }

        // Window resize listener to readjust radius if necessary
        window.addEventListener('resize', () => {
            renderCards();
            updateCarousel();
        });

        // Run on load
        window.onload = initCarousel;
    </script>
</body>
</html>
